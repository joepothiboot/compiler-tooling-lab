name: Update project pin

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to re-pin
        required: true
        type: choice
        options: [nano-dsp-mlir, vizmlir, schema-mlir]
      ref:
        description: Release tag or full 40-character commit SHA (branches are refused)
        required: true
        type: string
  repository_dispatch:
    types: [project-release]

permissions:
  contents: write

concurrency:
  group: update-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      PROJECT: ${{ inputs.project || github.event.client_payload.project }}
      REF: ${{ inputs.ref || github.event.client_payload.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIN_UPDATE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Re-pin manifest
        id: pin
        run: node scripts/update-manifest.mjs --project "$PROJECT" --ref "$REF" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.pin.outputs.changed == 'true'
        with:
          python-version: "3.11"
      - name: Install toolchain
        if: steps.pin.outputs.changed == 'true'
        run: |
          LLVM="$(node -p "require('./manifest.json').toolchain.llvm.split('.')[0]")"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM"
          sudo apt-get install -y "mlir-$LLVM-tools" "libmlir-$LLVM-dev" "llvm-$LLVM-tools" ninja-build
          python3 -m pip install --user lit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=/usr/lib/llvm-$LLVM" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pin.outputs.changed == 'true'
        with:
          targets: wasm32-unknown-unknown
      - name: Install pixi
        if: steps.pin.outputs.changed == 'true'
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Capture artifacts at the new pins
        if: steps.pin.outputs.changed == 'true'
        run: bash scripts/capture.sh

      - name: Check
        if: steps.pin.outputs.changed == 'true'
        run: npm run check

      - name: Refuse new unavailable artifacts
        if: steps.pin.outputs.changed == 'true'
        run: |
          count() { grep -o '"mode": "unavailable"' | wc -l; }
          before=$(git archive HEAD artifacts | tar -xO | count)
          after=$(cat artifacts/*.json | count)
          if [ "$after" -gt "$before" ]; then
            echo "::error::Unavailable artifacts went from $before to $after; see the capture step log."
            exit 1
          fi

      - name: Push to main
        if: steps.pin.outputs.changed == 'true'
        env:
          PROJECT: ${{ steps.pin.outputs.project }}
          VERSION: ${{ steps.pin.outputs.version }}
          COMPARE: https://github.com/${{ steps.pin.outputs.repo }}/compare/${{ steps.pin.outputs.from }}...${{ steps.pin.outputs.to }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json artifacts
          git commit -m "Pin $PROJECT to $VERSION" -m "Changes: $COMPARE" -m "Trigger: $GITHUB_EVENT_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
